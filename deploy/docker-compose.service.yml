services:
  gateway:
    build:
      context: ..
    image: bunway:latest
    container_name: bunway
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN}
      DB_PATH: /data/gateway.db
    volumes:
      - ../gateway-data:/data
  mock-upstream:
    image: oven/bun:1
    profiles: ["demo"]
    working_dir: /app
    command: bun run mock-upstream.ts
    restart: unless-stopped
    volumes:
      - ../demo:/app
